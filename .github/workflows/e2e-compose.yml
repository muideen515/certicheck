name: Docker Compose e2e
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start services with docker compose
        run: |
          docker compose up -d --build

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            docker compose exec -T db pg_isready -U certi && break || sleep 2
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run backend tests against compose services
        working-directory: backend
        run: |
          npm ci
          npm test --silent

      - name: Tear down
        if: always()
        run: docker compose down -v
