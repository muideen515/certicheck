name: Lint and Build Checks
on: [push, pull_request]
jobs:
  js-check:
    name: JS: install & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Backend install & test
        working-directory: backend
        run: |
          npm ci
          npm test
      - name: Frontend install & build
        working-directory: frontend-react
        run: |
          npm ci
          npm run build

  rust-check:
    name: Rust: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
      - name: Add rustfmt and clippy
        run: |
          rustup component add rustfmt clippy || true
      - name: Cargo fmt check (solana-program)
        working-directory: solana-program
        run: |
          cargo fmt -- --check
      - name: Cargo clippy (solana-program)
        working-directory: solana-program
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
