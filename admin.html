<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Certicheck Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styling.css"/>
</head>
<body>
  <nav id="navbar">
    <button class="nav-logo" onclick="window.location.href='index.html'" aria-label="Certicheck home">
      <svg width="34" height="34" viewBox="0 0 36 36" fill="none">
        <rect width="36" height="36" rx="8" fill="url(#logoGrad)"/>
        <path d="M8 10L18 6L28 10L28 20L18 26L8 20L8 10Z" stroke="white" stroke-width="1.6" fill="none"/>
        <path d="M18 6L18 26M8 10L28 20M28 10L8 20" stroke="white" stroke-width="1" opacity="0.5"/>
        <defs>
          <linearGradient id="logoGrad" x1="0" y1="0" x2="36" y2="36">
            <stop offset="0%" stop-color="#7c3aed"/>
            <stop offset="100%" stop-color="#4f46e5"/>
          </linearGradient>
        </defs>
      </svg>
      <span class="nav-brand">Certicheck Admin</span>
    </button>
    <div class="nav-actions">
      <button class="btn-ghost" onclick="window.location.href='index.html'">Main site</button>
      <div id="adminSignedInUser" class="admin-nav-user" style="display:none;align-items:center;gap:10px;margin-left:12px;position:relative">
        <button id="adminProfileToggle" class="btn-ghost" style="display:flex;align-items:center;gap:8px">
          <div class="admin-avatar" aria-hidden="true" style="width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#7c3aed,#4f46e5);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px">AD</div>
          <div style="display:flex;flex-direction:column;text-align:left">
            <div style="font-size:13px;font-weight:700;color:var(--text-primary)" id="navAdminName">Admin</div>
            <div style="font-size:11px;color:var(--text-secondary)" id="navAdminEmail"></div>
          </div>
        </button>
        <div id="adminProfileMenu" style="position:absolute;right:0;top:44px;display:none;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:10px;min-width:220px;box-shadow:var(--shadow-sm);z-index:999">
          <div style="font-weight:700;margin-bottom:6px" id="menuName">Admin</div>
          <div style="font-size:13px;color:var(--text-secondary);margin-bottom:10px" id="menuEmail"></div>
          <div style="display:flex;gap:8px;justify-content:flex-end">
            <button id="menuSignOut" class="btn-ghost">Sign out</button>
          </div>
        </div>
      </div>
    </div>
  </nav>
  
  <div class="page-wrap" style="max-width:1440px; margin:100px auto 80px; padding:0 18px;">

    <header class="admin-header" style="margin-bottom:22px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
        <div>
          <div class="eyebrow">Admin Portal</div>
          <h1 class="page-title" style="margin:6px 0 6px 0">Issuer Approval Console</h1>
          <p class="page-desc" style="margin:0;color:var(--text-secondary)">Sign in with an admin account to approve applications, revoke certificates, and review audit events.</p>
        </div>
        <div style="display:flex;gap:10px;align-items:center">
          <div id="adminSummary" style="color:var(--text-secondary);font-size:14px;text-align:right"></div>
        </div>
      </div>
    </header>

    <div id="adminLoginCard" class="form-card" style="max-width:560px;margin:26px auto 0;padding:28px;display:block;">
      <div id="adminLoginError" class="alert alert-danger" style="display:none;margin-bottom:16px;"></div>
      <form id="adminLoginForm" style="display:flex;flex-direction:column;gap:16px;">
        <div>
          <label for="adminEmail" style="display:block;margin-bottom:8px;font-weight:700;color:var(--text-primary);">Admin Email</label>
          <input id="adminEmail" type="email" name="email" placeholder="admin@certicheck.com" style="width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--bg-subtle);color:var(--text-primary);" required />
        </div>
        <div>
          <label for="adminPassword" style="display:block;margin-bottom:8px;font-weight:700;color:var(--text-primary);">Admin Password</label>
          <input id="adminPassword" type="password" name="password" placeholder="Enter admin password" style="width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--bg-subtle);color:var(--text-primary);" required />
        </div>
        <button type="submit" class="btn-primary" style="width:100%;justify-content:center;">Sign In</button>
      </form>
    </div>

    <section class="admin-stats" style="margin-bottom:18px;display:none;">
      <div id="adminStatsGrid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px"></div>
    </section>

    <div class="admin-main-grid" style="display:none;grid-template-columns:1fr 320px;gap:20px;align-items:start">

      <main class="admin-primary">
        <div class="form-card" id="adminDashboard" style="display:none;margin-top:14px;padding:18px">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
            <div>
              <div class="page-tag">Overview</div>
              <p class="page-desc" style="margin:0;">Review pending approvals, rejected requests, certificate checks, revoked certificates, and admin activity.</p>
            </div>
            <div style="text-align:right;color:var(--text-secondary);" id="adminSummary"></div>
          </div>

          <!-- tabs removed; actions available in Quick Actions -->
          <div id="adminSectionIntro" class="page-desc" style="margin:12px 0 0 0;color:var(--text-secondary);"></div>
          <div id="adminList" style="margin-top:18px;"></div>
        </div>

      </main>

      <aside class="admin-secondary">
        <div class="quick-actions form-card" style="padding:12px">
          <h4 style="margin:0 0 8px 0">Quick Actions</h4>
          <div style="display:grid;gap:8px;margin-top:8px">
            <button class="btn-outline" data-action-quick="pending">Pending</button>
            <button class="btn-outline" data-action-quick="approved">Approved</button>
            <button class="btn-outline" data-action-quick="rejected">Rejected</button>
            <button class="btn-outline" data-action-quick="revoked">Rejected</button>
            <button class="btn-outline" data-action-quick="checks">Checks</button>
            <button class="btn-outline" data-action-quick="audit">Audit Log</button>
          </div>
        </div>
      </aside>

    </div>

    <!-- audit-activity section removed (audit view is inside the dashboard) -->

  <div id="adminDetailDrawer" style="position:fixed;right:20px;top:80px;width:min(420px, calc(100vw - 32px));max-height:calc(100vh - 100px);overflow:auto;background:var(--bg-card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-lg);padding:20px;display:none;z-index:1200;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;">
      <div style="font-size:18px;font-weight:800;color:var(--text-primary);">Application detail</div>
      <button id="adminDrawerClose" class="btn-ghost" type="button">Close</button>
    </div>
    <div id="adminDetailContent"></div>
  </div>

  <div id="adminToastStack" style="position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:1300;"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="admin.js"></script>
</div>
</body>
</html>
